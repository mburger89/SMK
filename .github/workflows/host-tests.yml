name: SMKCore Host Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    env:
      SMK_HOST_TESTS_ONLY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SMKCore test suite
        run: swift test
