name: Build SMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32c6
          command: |
            # Install Swift dependencies inside the container
            apt-get update
            apt-get install -y binutils-dev libcurl4-openssl-dev libedit-dev libicu-dev libncurses5-dev libpython3-dev libsqlite3-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev

            # Download and setup Swift 6.3.1
            SWIFT_FILE="swift-6.3.1-RELEASE-ubuntu22.04"
            curl -L -o swift.tar.gz https://download.swift.org/swift-6.3.1-release/ubuntu2204/swift-6.3.1-RELEASE/${SWIFT_FILE}.tar.gz
            tar xzf swift.tar.gz
            export PATH=$PATH:$(pwd)/${SWIFT_FILE}/usr/bin

            # Verify toolchain
            swiftc --version

            # Build project
            idf.py build

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smk-firmware
          path: |
            build/my_swift_keyboard.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flashing_args
