name: Build SMK Firmware

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build Firmware
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v6.0
          target: esp32c6
          command: |
            # Install Swift dependencies inside the container
            apt-get update
            apt-get install -y binutils-dev libcurl4-openssl-dev libedit-dev libicu-dev libncurses5-dev libpython3-dev libsqlite3-dev libxml2-dev libz3-dev pkg-config tzdata zlib1g-dev

            # Download and setup Swift Nightly (Experimental RISC-V support is in snapshots)
            SWIFT_SNAPSHOT="swift-6.0-DEVELOPMENT-SNAPSHOT-2024-09-19-a"
            curl -L -o swift.tar.gz https://download.swift.org/swift-6.0-branch/ubuntu2204/${SWIFT_SNAPSHOT}/${SWIFT_SNAPSHOT}-ubuntu2204.tar.gz
            tar xzf swift.tar.gz
            
            # Find the actual bin directory (resilient to folder structure changes)
            export SWIFTC_PATH=$(pwd)/$(find . -name swiftc -type f | head -n 1)
            export PATH=$(dirname $SWIFTC_PATH):$PATH

            # Verify toolchain
            $SWIFTC_PATH --version
            
            # Build project (Passing SWIFTC_PATH explicitly to CMake)
            idf.py build -DSWIFTC_PATH=$SWIFTC_PATH

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smk-firmware
          path: |
            build/my_swift_keyboard.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/flashing_args
